<svg xmlns="http://www.w3.org/2000/svg"
     width="180"
     height="180"
     viewBox="32 24 152 140"
     fill="none">

  <defs>
    <linearGradient id="walletGradient"
      x1="44" y1="55" x2="118" y2="150"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#12B886"/>
      <stop offset="1" stop-color="#087F5B"/>
    </linearGradient>
  </defs>

  <!-- Wallet back -->
  <path d="M44 58 L112 34 C118 32 123 36 123 42 L123 58 Z"
        fill="#168D70"/>

  <rect x="44" y="55" width="112" height="95"
        rx="14" fill="#0C1A33"/>

  <rect x="56" y="62" width="24" height="6"
        rx="3" fill="#FFFFFF"/>

  <!-- Coin -->
  <circle cx="106" cy="64" r="27" fill="#0BB079"/>
  <circle cx="106" cy="64" r="21" fill="#0C1A33"/>
  <circle cx="106" cy="64" r="15" fill="#087F5B"/>

  <!-- Wallet front -->
  <path d="M44 60 L54 68 L118 68 L118 150 L58 150
           C50 150 44 144 44 136 Z"
        fill="url(#walletGradient)"/>

  <path d="M48 146 L86 112 L98 150 L56 150
           C51 150 48 146 48 146 Z"
        fill="#067A55" opacity=".7"/>

  <rect x="142" y="96" width="18" height="24"
        rx="5" fill="#087F5B"/>

  <!-- Growth arrow -->
  <path d="M44 130 L85 88 L102 105 L154 52"
        stroke="#FFFFFF" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M44 138 L85 96 L102 113 L156 56"
        stroke="#0BB079" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M134 44 L172 36 L164 74 Z"
        fill="#0BB079"/>

  <!-- Leaf -->
  <path d="M105 150 C105 118 126 98 148 98
           C148 124 132 148 105 150 Z"
        fill="#FFFFFF"/>

  <path d="M104 150 C114 134 125 120 137 110"
        stroke="#087F5B" stroke-width="4.5"
        stroke-linecap="round"/>

</svg>
